---
- name: Download containerd tarball
  ansible.builtin.get_url:
    url: "https://github.com/containerd/containerd/releases/download/v{{ containerd_version }}/containerd-{{ containerd_version }}-linux-amd64.tar.gz"
    dest: /tmp/containerd-{{ containerd_version }}-linux-amd64.tar.gz
    mode: "0644"

- name: Extract containerd tarball
  ansible.builtin.unarchive:
    src: /tmp/containerd-{{ containerd_version }}-linux-amd64.tar.gz
    dest: /usr
    remote_src: true

- name: Install RedHat-specific dependencies
  when: ansible_os_family == "RedHat"
  block:
    - name: Install container-selinux
      ansible.builtin.dnf:
        name: container-selinux
        state: present
    - name: Install and enable systemd-resolved
      ansible.builtin.dnf:
        name: systemd-resolved
        state: present
    - name: Enable and restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        daemon_reload: true
        enabled: true
        state: restarted

- name: Reload systemd to pick up containerd service
  ansible.builtin.systemd:
    daemon_reload: true

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Generate default containerd configuration
  ansible.builtin.command: containerd config default
  register: containerd_config
  changed_when: false

- name: Write containerd configuration
  ansible.builtin.copy:
    content: "{{ containerd_config.stdout }}"
    dest: /etc/containerd/config.toml
    mode: "0644"

- name: Update containerd sandbox image
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'sandbox_image = "registry\.k8s\.io/pause:3\.\d+"'
    replace: 'sandbox_image = "registry.k8s.io/pause:{{ pause_version }}"'

- name: Configure containerd to use systemd cgroup driver
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: "SystemdCgroup = false"
    replace: "SystemdCgroup = true"

- name: Enable and restart containerd service
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true
    daemon_reload: true
